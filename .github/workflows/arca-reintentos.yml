name: Reintentos de facturación ARCA

# Cada 10 minutos le pide a la app que reintente las facturas que quedaron 'pendiente'
# (ARCA caída, red, timeout). Las que ARCA rechazó ('error') NO se reintentan solas: las revisa
# una persona en /admin/facturacion. Si no hay nada pendiente la llamada es una consulta liviana.
#
# Requiere el secret CRON_SECRET en GitHub (el MISMO valor que el secret CRON_SECRET del Worker).
# Opcional: la variable de repositorio APP_URL si cambia el dominio de la app.
# GitHub solo corre los cron del branch principal, y puede demorarlos unos minutos con mucha carga.
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Dos corridas a la vez no suman nada: la app ya tiene su propio candado por comprobante.
concurrency:
  group: arca-reintentos
  cancel-in-progress: false

jobs:
  reintentar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reintentar comprobantes pendientes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://kioscos-ideia.lytwyn-ideia.workers.dev' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Falta el secret CRON_SECRET en GitHub: no se reintenta nada. Cargalo en Settings > Secrets and variables > Actions."
            exit 0
          fi
          curl --silent --show-error --fail-with-body --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/arca/reintentar"
          echo
