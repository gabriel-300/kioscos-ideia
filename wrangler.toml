name = "kioscos-ideia"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# El Worker corre pegado a la base (Supabase está en sa-east-1). Cada pantalla
# del admin hace decenas de consultas; con el Worker en Buenos Aires cada una
# pagaba un viaje de ida y vuelta a São Paulo. Reversible: borrar estas líneas.
[placement]
mode = "targeted"
region = "aws:sa-east-1"

# Registro de lo que pasa en producción (errores del bot de WhatsApp, de la IA, de
# los webhooks). Se activó desde el dashboard y se declara acá porque el deploy
# automático (wrangler deploy desde GitHub) toma esta configuración como la
# verdadera y puede apagarlo. Traces apagado a propósito: no hace falta y suma costo.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
